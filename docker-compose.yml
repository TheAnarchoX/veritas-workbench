services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-veritas}
      POSTGRES_USER: ${POSTGRES_USER:-veritas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veritas}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-veritas} -d ${POSTGRES_DB:-veritas}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-veritas};Username=${POSTGRES_USER:-veritas};Password=${POSTGRES_PASSWORD:-veritas}
      Database__ApplyMigrations: "true"
      Demo__SeedData: "true"
      Robots__UserAgent: ${VERITAS_USER_AGENT:-VeritasWorkbench/0.1 (+local-first investigation workspace)}
      Analysis__RunBackgroundWorker: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./data/storage:/workspace/data/storage
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres-data:

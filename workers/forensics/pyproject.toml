[project]
name = "veritas-forensics"
version = "0.1.0"
description = "Conservative media-forensics worker for Veritas Workbench"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.0.0",
  "numpy>=1.26.0",
  "ImageHash>=4.3.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
